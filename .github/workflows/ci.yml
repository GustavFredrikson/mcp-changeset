name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.mcp-label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        mcp-label: ["mcp 1.x", "mcp 2.x"]
        include:
          - mcp-label: "mcp 1.x"
            mcp: "mcp>=1.10,<2"
          - mcp-label: "mcp 2.x"
            mcp: "mcp>=2,<3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install
        run: |
          uv sync --python ${{ matrix.python }}
          uv pip install "${{ matrix.mcp }}"
      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Mypy (strict)
        run: |
          if [ "${{ matrix.mcp-label }}" = "mcp 2.x" ]; then
            uv run --no-sync mypy --python-version ${{ matrix.python }}
          else
            # examples/elicit_server.py needs mcp 2.x APIs
            uv run --no-sync mypy --python-version ${{ matrix.python }} \
              src examples/_compat.py examples/todo_server.py examples/notes_server.py \
              examples/github_labels_server.py examples/tickets_server.py examples/client_demo.py
          fi
      - name: Pyright (strict)
        run: uv run --no-sync pyright --pythonversion ${{ matrix.python }}
      - name: Pytest
        run: uv run --no-sync pytest --cov --cov-report=term-missing --cov-fail-under=95
      - name: Example smoke run (stdio client -> notes server)
        run: uv run --no-sync python examples/client_demo.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/mcp-changeset --help
          /tmp/smoke/bin/python -m mcp_changeset --version

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflow files
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

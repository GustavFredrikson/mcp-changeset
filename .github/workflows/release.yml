name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored
# anywhere. The PyPI publisher must be configured with exactly
#   owner GustavFredrikson, repository mcp-changeset,
#   workflow release.yml, environment pypi.
#
# Triggers:
#   * a published GitHub release whose tag is v<version> -> build, check, publish
#   * workflow_dispatch -> dry run: build and check only, never publishes

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check that the tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/mcp_changeset/__init__.py)
          echo "tag=$TAG pyproject=$version __version__=$module"
          if [ "$TAG" != "v$version" ] || [ "$module" != "$version" ]; then
            echo "::error::release tag $TAG does not match version $version (__version__ $module)"
            exit 1
          fi
      - name: Build sdist and wheel
        run: python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel in a clean virtualenv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c 'import mcp_changeset, sys; print(mcp_changeset.__version__)'
          /tmp/smoke/bin/mcp-changeset --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-changeset/
    permissions:
      id-token: write # mandatory for Trusted Publishing; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

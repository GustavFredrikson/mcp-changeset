name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored
# anywhere. The PyPI publisher must be configured with exactly
#   owner GustavFredrikson, repository mcp-changeset,
#   workflow release.yml, environment pypi.
#
# Trigger: pushing a tag v<version> (for example v0.1.0) builds, checks and
# publishes. Nothing else runs this workflow; CI's build job already checks
# the distributions on every push to main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/mcp_changeset/__init__.py)
          echo "tag=$TAG pyproject=$version __version__=$module"
          if [ "$TAG" != "v$version" ] || [ "$module" != "$version" ]; then
            echo "::error::tag $TAG does not match version $version (__version__ $module)"
            exit 1
          fi
      - name: Build sdist and wheel
        run: python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel in a clean virtualenv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c 'import mcp_changeset, sys; print(mcp_changeset.__version__)'
          /tmp/smoke/bin/mcp-changeset --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-changeset
    permissions:
      id-token: write # mandatory for Trusted Publishing; nothing else is granted
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
